<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Blast Deluxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        * {
            font-family: 'Fredoka', cursive, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        :root {
            --bg-main: #0f172a;
            --board-bg: #1e293b;
            --cell-empty: #334155;
            --accent: #38bdf8;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        /* Themes */
        body.theme-wood {
            --bg-main: #2c1810;
            --board-bg: #42281d;
            --cell-empty: #5c3a28;
            --accent: #fbbf24;
            --panel-bg: rgba(66, 40, 29, 0.8);
            --border-color: rgba(251, 191, 36, 0.2);
        }

        body.theme-cyberpunk {
            --bg-main: #180828;
            --board-bg: #2d124d;
            --cell-empty: #451a75;
            --accent: #f43f5e;
            --panel-bg: rgba(45, 18, 77, 0.8);
            --border-color: rgba(244, 63, 94, 0.3);
        }

        body.theme-pastel {
            --bg-main: #2a2d34;
            --board-bg: #3b3e47;
            --cell-empty: #4f535e;
            --accent: #a7f3d0;
            --panel-bg: rgba(59, 62, 71, 0.8);
            --border-color: rgba(255, 255, 255, 0.15);
        }

        body {
            background-color: var(--bg-main);
            transition: background-color 0.4s ease;
            overflow: hidden;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 8px var(--accent)); }
            50% { opacity: 1; filter: drop-shadow(0 0 15px var(--accent)); }
        }

        @keyframes lineClear {
            0% { transform: scale(1); filter: brightness(2) white; }
            50% { transform: scale(1.15); filter: brightness(3); }
            100% { transform: scale(0); opacity: 0; }
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-4px, 4px); }
            40% { transform: translate(-4px, -4px); }
            60% { transform: translate(4px, 4px); }
            80% { transform: translate(4px, -4px); }
        }

        .animate-shake {
            animation: shake 0.3s ease-in-out;
        }

        .cell-clearing {
            animation: lineClear 0.35s ease-out forwards;
        }

        .cell-preview {
            opacity: 0.5;
            transform: scale(0.95);
        }

        .dragging-active {
            cursor: grabbing !important;
        }

        /* Custom Scrollbar for Modal */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        canvas#particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-2 sm:p-4 text-white select-none">

    <!-- Canvas for Particle Effects -->
    <canvas id="particleCanvas"></canvas>

    <!-- Header Section -->
    <header class="w-full max-w-md flex items-center justify-between pt-1 pb-2">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
                <i class="fa-solid fa-cubes text-xl text-white"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wider leading-none text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                    BLOCK BLAST
                </h1>
                <span class="text-[10px] text-slate-400 font-semibold tracking-widest uppercase">Edizione Italiana</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-2">
            <button id="btnSound" class="w-10 h-10 rounded-xl glass-panel flex items-center justify-center text-slate-300 hover:text-white hover:bg-white/10 active:scale-95 transition">
                <i class="fa-solid fa-volume-high text-lg"></i>
            </button>
            <button id="btnTheme" class="w-10 h-10 rounded-xl glass-panel flex items-center justify-center text-slate-300 hover:text-white hover:bg-white/10 active:scale-95 transition">
                <i class="fa-solid fa-palette text-lg"></i>
            </button>
            <button id="btnStats" class="w-10 h-10 rounded-xl glass-panel flex items-center justify-center text-slate-300 hover:text-white hover:bg-white/10 active:scale-95 transition">
                <i class="fa-solid fa-chart-simple text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Scoreboards -->
    <div class="w-full max-w-md grid grid-cols-2 gap-3 mb-2">
        <div class="glass-panel p-3 rounded-2xl flex flex-col items-center justify-center relative overflow-hidden">
            <div class="absolute -top-6 -left-6 w-12 h-12 bg-cyan-500/10 rounded-full blur-xl"></div>
            <span class="text-xs uppercase text-slate-400 font-bold tracking-wider">Punteggio</span>
            <span id="scoreText" class="text-3xl font-extrabold text-cyan-400">0</span>
        </div>
        <div class="glass-panel p-3 rounded-2xl flex flex-col items-center justify-center relative overflow-hidden">
            <div class="absolute -top-6 -right-6 w-12 h-12 bg-amber-500/10 rounded-full blur-xl"></div>
            <span class="text-xs uppercase text-slate-400 font-bold tracking-wider">Record</span>
            <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-trophy text-amber-400 text-sm"></i>
                <span id="highScoreText" class="text-3xl font-extrabold text-amber-400">0</span>
            </div>
        </div>
    </div>

    <!-- Combo Banner Overlay -->
    <div id="comboBanner" class="fixed top-28 pointer-events-none opacity-0 transition-all duration-300 transform scale-50 z-40 flex flex-col items-center">
        <span id="comboText" class="text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-orange-400 to-red-500 drop-shadow-[0_4px_12px_rgba(245,158,11,0.6)]">
            COMBO x2!
        </span>
        <span id="comboSubText" class="text-sm font-bold text-amber-200 tracking-widest uppercase mt-1">
            Incredibile!
        </span>
    </div>

    <!-- Main Game Board Container -->
    <main class="w-full max-w-md flex flex-col items-center justify-center relative my-auto">
        <div id="boardContainer" class="w-full aspect-square glass-panel p-2.5 rounded-3xl shadow-2xl relative flex items-center justify-center">
            <div id="board" class="grid grid-cols-8 grid-rows-8 gap-1.5 w-full h-full">
                <!-- 64 cells generated dynamically -->
            </div>
        </div>

        <!-- Power-ups Bar -->
        <div class="w-full flex items-center justify-between px-2 mt-3">
            <button id="btnUndo" class="flex items-center gap-2 px-4 py-2 rounded-xl glass-panel text-slate-300 hover:text-white active:scale-95 transition disabled:opacity-40 disabled:pointer-events-none">
                <i class="fa-solid fa-rotate-left text-amber-400"></i>
                <span class="text-xs font-bold uppercase">Annulla</span>
                <span id="undoBadge" class="bg-amber-500/20 text-amber-300 text-[10px] px-1.5 py-0.5 rounded-full font-bold">1</span>
            </button>

            <button id="btnRestart" class="flex items-center gap-2 px-4 py-2 rounded-xl glass-panel text-slate-300 hover:text-white active:scale-95 transition">
                <i class="fa-solid fa-arrows-rotate text-cyan-400"></i>
                <span class="text-xs font-bold uppercase">Riavvia</span>
            </button>
        </div>
    </main>

    <!-- Pieces Selection Dock -->
    <footer class="w-full max-w-md my-2">
        <div id="piecesContainer" class="glass-panel rounded-3xl p-3 flex items-center justify-around min-h-[110px] sm:min-h-[130px] relative">
            <!-- 3 Piece Slots -->
            <div class="piece-slot w-1/3 h-full flex items-center justify-center" data-slot="0"></div>
            <div class="piece-slot w-1/3 h-full flex items-center justify-center" data-slot="1"></div>
            <div class="piece-slot w-1/3 h-full flex items-center justify-center" data-slot="2"></div>
        </div>
    </footer>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <div class="glass-panel p-6 rounded-3xl max-w-sm w-full text-center relative flex flex-col items-center transform scale-90 transition-transform duration-300" id="gameOverContent">
            <div class="w-16 h-16 rounded-2xl bg-red-500/20 text-red-400 flex items-center justify-center text-3xl mb-3">
                <i class="fa-solid fa-heart-crack"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-white mb-1">GAME OVER</h2>
            <p class="text-slate-400 text-sm mb-4">Nessuna mossa disponibile!</p>

            <div class="w-full bg-slate-800/60 rounded-2xl p-4 mb-5 flex justify-around">
                <div>
                    <span class="text-[10px] uppercase text-slate-400 font-bold block">Punti</span>
                    <span id="finalScore" class="text-2xl font-black text-cyan-400">0</span>
                </div>
                <div class="border-r border-slate-700/50"></div>
                <div>
                    <span class="text-[10px] uppercase text-slate-400 font-bold block">Migliore</span>
                    <span id="finalHighScore" class="text-2xl font-black text-amber-400">0</span>
                </div>
            </div>

            <!-- Second Chance Button -->
            <button id="btnRevive" class="w-full py-3 px-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white rounded-2xl font-bold shadow-lg shadow-emerald-500/30 flex items-center justify-center gap-2 mb-3 active:scale-95 transition">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>Seconda Chance (Pulisci 3x3)</span>
            </button>

            <!-- New Game Button -->
            <button id="btnModalRestart" class="w-full py-3 px-4 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl font-bold flex items-center justify-center gap-2 active:scale-95 transition">
                <i class="fa-solid fa-play"></i>
                <span>Nuova Partita</span>
            </button>
        </div>
    </div>

    <!-- Stats Modal -->
    <div id="statsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <div class="glass-panel p-6 rounded-3xl max-w-sm w-full relative flex flex-col items-center">
            <button id="btnCloseStats" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="w-12 h-12 rounded-2xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-2xl mb-2">
                <i class="fa-solid fa-chart-line"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-4">Statistiche</h2>

            <div class="w-full space-y-2.5 mb-2">
                <div class="flex justify-between items-center p-3 rounded-xl bg-slate-800/50">
                    <span class="text-sm text-slate-300">Partite Giocate</span>
                    <span id="statPlayed" class="font-bold text-cyan-400">0</span>
                </div>
                <div class="flex justify-between items-center p-3 rounded-xl bg-slate-800/50">
                    <span class="text-sm text-slate-300">Linee Distrutte</span>
                    <span id="statLines" class="font-bold text-emerald-400">0</span>
                </div>
                <div class="flex justify-between items-center p-3 rounded-xl bg-slate-800/50">
                    <span class="text-sm text-slate-300">Combo Max</span>
                    <span id="statMaxCombo" class="font-bold text-amber-400">0</span>
                </div>
                <div class="flex justify-between items-center p-3 rounded-xl bg-slate-800/50">
                    <span class="text-sm text-slate-300">Blocchi Posizionati</span>
                    <span id="statBlocks" class="font-bold text-purple-400">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* Block Blast Game Engine & Audio Synthesizer */
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playTone(freq, type, duration, gainValue = 0.1) {
                if (this.muted) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainValue, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playPick() {
                this.playTone(400, 'sine', 0.08, 0.08);
            }

            playPlace() {
                this.playTone(180, 'triangle', 0.12, 0.15);
            }

            playClear(comboCount = 1) {
                const baseFreq = 300 + (comboCount * 80);
                this.playTone(baseFreq, 'sine', 0.2, 0.2);
                setTimeout(() => this.playTone(baseFreq * 1.25, 'sine', 0.25, 0.2), 60);
                if (comboCount > 1) {
                    setTimeout(() => this.playTone(baseFreq * 1.5, 'sine', 0.3, 0.25), 120);
                }
            }

            playGameOver() {
                this.playTone(250, 'sawtooth', 0.3, 0.2);
                setTimeout(() => this.playTone(200, 'sawtooth', 0.3, 0.2), 200);
                setTimeout(() => this.playTone(150, 'sawtooth', 0.4, 0.2), 400);
            }

            playClick() {
                this.playTone(600, 'sine', 0.05, 0.05);
            }
        }

        // Particle System
        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            spawn(x, y, color, count = 12) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 6;
                    this.particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: 3 + Math.random() * 5,
                        color,
                        alpha: 1,
                        decay: 0.02 + Math.random() * 0.02
                    });
                }
            }

            update() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.15; // Gravity
                    p.alpha -= p.decay;

                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }

                    this.ctx.save();
                    this.ctx.globalAlpha = p.alpha;
                    this.ctx.fillStyle = p.color;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                }
                requestAnimationFrame(() => this.update());
            }
        }

        const SHAPES = [
            // Singles / Small
            { shape: [[1]], color: '#38bdf8' },
            { shape: [[1, 1]], color: '#fbbf24' },
            { shape: [[1], [1]], color: '#fbbf24' },
            
            // Squares
            { shape: [[1, 1], [1, 1]], color: '#f43f5e' },
            { shape: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: '#a855f7' },

            // Lines
            { shape: [[1, 1, 1]], color: '#34d399' },
            { shape: [[1], [1], [1]], color: '#34d399' },
            { shape: [[1, 1, 1, 1]], color: '#818cf8' },
            { shape: [[1], [1], [1], [1]], color: '#818cf8' },
            { shape: [[1, 1, 1, 1, 1]], color: '#ec4899' },
            { shape: [[1], [1], [1], [1], [1]], color: '#ec4899' },

            // L & J Shapes
            { shape: [[1, 0], [1, 0], [1, 1]], color: '#f97316' },
            { shape: [[0, 1], [0, 1], [1, 1]], color: '#f97316' },
            { shape: [[1, 1, 1], [1, 0, 0]], color: '#10b981' },
            { shape: [[1, 1, 1], [0, 0, 1]], color: '#10b981' },

            // T Shapes
            { shape: [[1, 1, 1], [0, 1, 0]], color: '#06b6d4' },
            { shape: [[0, 1, 0], [1, 1, 1]], color: '#06b6d4' },

            // Corner / Diagonal
            { shape: [[1, 1], [1, 0]], color: '#eab308' },
            { shape: [[1, 1], [0, 1]], color: '#eab308' }
        ];

        class BlockBlastGame {
            constructor() {
                this.gridSize = 8;
                this.grid = Array(this.gridSize).fill(null).map(() => Array(this.gridSize).fill(null));
                this.score = 0;
                this.highScore = parseInt(localStorage.getItem('bb_highscore') || '0');
                this.combo = 0;
                this.history = null;
                this.undoAvailable = 1;
                this.reviveAvailable = true;

                // Stats
                this.stats = JSON.parse(localStorage.getItem('bb_stats') || '{"played":0,"lines":0,"maxCombo":0,"blocks":0}');

                // Audio & FX
                this.audio = new AudioEngine();
                this.particles = new ParticleSystem(document.getElementById('particleCanvas'));
                this.particles.update();

                // Themes
                this.themes = ['neon', 'wood', 'cyberpunk', 'pastel'];
                this.currentThemeIdx = 0;

                // Drag state
                this.activePiece = null;
                this.activeSlotIdx = null;

                this.initDOM();
                this.bindEvents();
                this.startNewGame();
            }

            initDOM() {
                this.boardEl = document.getElementById('board');
                this.scoreEl = document.getElementById('scoreText');
                this.highScoreEl = document.getElementById('highScoreText');
                this.piecesSlots = document.querySelectorAll('.piece-slot');
                this.comboBanner = document.getElementById('comboBanner');
                this.comboText = document.getElementById('comboText');
                this.comboSubText = document.getElementById('comboSubText');
                this.undoBtn = document.getElementById('btnUndo');
                this.undoBadge = document.getElementById('undoBadge');

                // Render Grid Cells
                this.boardEl.innerHTML = '';
                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'w-full h-full rounded-xl transition-all duration-150 flex items-center justify-center';
                        cell.style.backgroundColor = 'var(--cell-empty)';
                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        this.boardEl.appendChild(cell);
                    }
                }

                this.highScoreEl.innerText = this.highScore;
            }

            startNewGame() {
                this.grid = Array(this.gridSize).fill(null).map(() => Array(this.gridSize).fill(null));
                this.score = 0;
                this.combo = 0;
                this.undoAvailable = 1;
                this.reviveAvailable = true;
                this.history = null;
                this.updateScore(0);
                this.renderBoard();
                this.spawnPieces();
                this.updateUndoButton();

                this.stats.played++;
                this.saveStats();
            }

            renderBoard() {
                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        const cell = this.getCellEl(r, c);
                        const val = this.grid[r][c];

                        if (val) {
                            cell.style.backgroundColor = val;
                            cell.style.boxShadow = `inset 0 2px 4px rgba(255,255,255,0.3), 0 4px 8px rgba(0,0,0,0.3)`;
                            cell.classList.remove('cell-preview');
                        } else {
                            cell.style.backgroundColor = 'var(--cell-empty)';
                            cell.style.boxShadow = 'none';
                            cell.classList.remove('cell-preview');
                        }
                    }
                }
            }

            getCellEl(r, c) {
                return this.boardEl.children[r * this.gridSize + c];
            }

            spawnPieces() {
                this.piecesSlots.forEach((slot, idx) => {
                    slot.innerHTML = '';
                    const randomShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                    const pieceEl = this.createPieceDOM(randomShape, idx);
                    slot.appendChild(pieceEl);
                });
                this.checkGameOver();
            }

            createPieceDOM(pieceData, slotIdx) {
                const container = document.createElement('div');
                container.className = 'piece-element cursor-grab active:cursor-grabbing p-2 transition-transform duration-200 hover:scale-105';
                container.dataset.slot = slotIdx;
                container.dataset.json = JSON.stringify(pieceData);

                const shape = pieceData.shape;
                const rows = shape.length;
                const cols = shape[0].length;

                const grid = document.createElement('div');
                grid.className = 'grid gap-1 pointer-events-none';
                grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const block = document.createElement('div');
                        const cellSize = window.innerWidth < 640 ? 18 : 22;
                        block.style.width = `${cellSize}px`;
                        block.style.height = `${cellSize}px`;

                        if (shape[r][c]) {
                            block.className = 'rounded-md shadow-md';
                            block.style.backgroundColor = pieceData.color;
                            block.style.boxShadow = `inset 0 1px 2px rgba(255,255,255,0.4)`;
                        } else {
                            block.className = 'opacity-0';
                        }
                        grid.appendChild(block);
                    }
                }

                container.appendChild(grid);
                return container;
            }

            bindEvents() {
                // Drag & Drop Handling (Mouse + Touch)
                document.addEventListener('pointerdown', (e) => this.onPointerDown(e));
                document.addEventListener('pointermove', (e) => this.onPointerMove(e));
                document.addEventListener('pointerup', (e) => this.onPointerUp(e));

                // Control Buttons
                document.getElementById('btnSound').addEventListener('click', () => {
                    this.audio.muted = !this.audio.muted;
                    document.getElementById('btnSound').innerHTML = this.audio.muted 
                        ? '<i class="fa-solid fa-volume-xmark text-red-400"></i>' 
                        : '<i class="fa-solid fa-volume-high text-lg"></i>';
                });

                document.getElementById('btnTheme').addEventListener('click', () => {
                    this.currentThemeIdx = (this.currentThemeIdx + 1) % this.themes.length;
                    document.body.className = `theme-${this.themes[this.currentThemeIdx]}`;
                    this.audio.playClick();
                });

                document.getElementById('btnStats').addEventListener('click', () => {
                    this.showStats();
                    this.audio.playClick();
                });

                document.getElementById('btnCloseStats').addEventListener('click', () => {
                    document.getElementById('statsModal').classList.add('opacity-0', 'pointer-events-none');
                });

                document.getElementById('btnRestart').addEventListener('click', () => {
                    if (confirm('Vuoi davvero riavviare la partita?')) {
                        this.startNewGame();
                        this.audio.playClick();
                    }
                });

                this.undoBtn.addEventListener('click', () => this.undoMove());

                // Modal Game Over Buttons
                document.getElementById('btnModalRestart').addEventListener('click', () => {
                    this.hideGameOverModal();
                    this.startNewGame();
                });

                document.getElementById('btnRevive').addEventListener('click', () => {
                    this.useRevive();
                });
            }

            onPointerDown(e) {
                const pieceEl = e.target.closest('.piece-element');
                if (!pieceEl) return;

                this.audio.playPick();
                const slotIdx = pieceEl.dataset.slot;
                const pieceData = JSON.parse(pieceEl.dataset.json);

                this.activePiece = pieceData;
                this.activeSlotIdx = slotIdx;
                this.dragEl = pieceEl;

                // Create Drag Ghost
                this.ghostEl = pieceEl.cloneNode(true);
                this.ghostEl.style.position = 'fixed';
                this.ghostEl.style.pointerEvents = 'none';
                this.ghostEl.style.zIndex = '1000';
                this.ghostEl.style.transform = 'scale(1.2) translateY(-40px)';
                document.body.appendChild(this.ghostEl);

                pieceEl.classList.add('opacity-20');
                this.updateGhostPosition(e);
            }

            onPointerMove(e) {
                if (!this.ghostEl) return;
                this.updateGhostPosition(e);
                this.updatePreview(e);
            }

            onPointerUp(e) {
                if (!this.ghostEl) return;

                const targetCell = this.getHoveredCell(e);
                let placed = false;

                if (targetCell) {
                    const r = parseInt(targetCell.dataset.row);
                    const c = parseInt(targetCell.dataset.col);

                    if (this.canPlacePiece(this.activePiece.shape, r, c)) {
                        this.placePiece(this.activePiece, r, c);
                        placed = true;
                    }
                }

                // Cleanup Ghost
                this.ghostEl.remove();
                this.ghostEl = null;
                this.clearPreview();

                if (placed) {
                    // Remove piece from slot
                    this.piecesSlots[this.activeSlotIdx].innerHTML = '';
                    this.activePiece = null;
                    this.activeSlotIdx = null;

                    // Check if all slots empty
                    const remaining = Array.from(this.piecesSlots).some(s => s.children.length > 0);
                    if (!remaining) {
                        this.spawnPieces();
                    } else {
                        this.checkGameOver();
                    }
                } else {
                    // Reset Piece
                    if (this.dragEl) this.dragEl.classList.remove('opacity-20');
                }
            }

            updateGhostPosition(e) {
                if (this.ghostEl) {
                    this.ghostEl.style.left = `${e.clientX - 40}px`;
                    this.ghostEl.style.top = `${e.clientY - 60}px`;
                }
            }

            getHoveredCell(e) {
                // Adjust position for target calculation (offset finger)
                const yOffset = -40;
                const elem = document.elementFromPoint(e.clientX, e.clientY + yOffset);
                return elem ? elem.closest('[data-row]') : null;
            }

            updatePreview(e) {
                this.clearPreview();
                const targetCell = this.getHoveredCell(e);
                if (!targetCell) return;

                const r = parseInt(targetCell.dataset.row);
                const c = parseInt(targetCell.dataset.col);

                if (this.canPlacePiece(this.activePiece.shape, r, c)) {
                    const shape = this.activePiece.shape;
                    for (let sr = 0; sr < shape.length; sr++) {
                        for (let sc = 0; sc < shape[0].length; sc++) {
                            if (shape[sr][sc]) {
                                const cell = this.getCellEl(r + sr, c + sc);
                                if (cell) {
                                    cell.style.backgroundColor = this.activePiece.color;
                                    cell.classList.add('cell-preview');
                                }
                            }
                        }
                    }
                }
            }

            clearPreview() {
                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        const cell = this.getCellEl(r, c);
                        if (cell.classList.contains('cell-preview')) {
                            cell.classList.remove('cell-preview');
                            cell.style.backgroundColor = this.grid[r][c] || 'var(--cell-empty)';
                        }
                    }
                }
            }

            canPlacePiece(shape, r, c) {
                const rows = shape.length;
                const cols = shape[0].length;

                if (r + rows > this.gridSize || c + cols > this.gridSize) return false;

                for (let sr = 0; sr < rows; sr++) {
                    for (let sc = 0; sc < cols; sc++) {
                        if (shape[sr][sc] && this.grid[r + sr][c + sc] !== null) {
                            return false;
                        }
                    }
                }
                return true;
            }

            placePiece(pieceData, r, c) {
                // Save state for Undo
                this.saveHistory();

                const shape = pieceData.shape;
                let blocksPlaced = 0;

                for (let sr = 0; sr < shape.length; sr++) {
                    for (let sc = 0; sc < shape[0].length; sc++) {
                        if (shape[sr][sc]) {
                            this.grid[r + sr][c + sc] = pieceData.color;
                            blocksPlaced++;
                        }
                    }
                }

                this.stats.blocks += blocksPlaced;
                this.audio.playPlace();
                this.renderBoard();

                // Check Line Clears
                const linesCleared = this.checkAndClearLines();

                if (linesCleared > 0) {
                    this.combo++;
                    const bonus = linesCleared * 10 * this.combo;
                    this.updateScore(this.score + (linesCleared * 10) + bonus);
                    this.triggerComboFX(linesCleared);
                    this.stats.lines += linesCleared;
                } else {
                    this.combo = 0;
                    this.updateScore(this.score + blocksPlaced);
                }

                if (this.combo > this.stats.maxCombo) {
                    this.stats.maxCombo = this.combo;
                }

                this.saveStats();
            }

            checkAndClearLines() {
                const fullRows = [];
                const fullCols = [];

                // Check Rows
                for (let r = 0; r < this.gridSize; r++) {
                    if (this.grid[r].every(cell => cell !== null)) {
                        fullRows.push(r);
                    }
                }

                // Check Columns
                for (let c = 0; c < this.gridSize; c++) {
                    let full = true;
                    for (let r = 0; r < this.gridSize; r++) {
                        if (this.grid[r][c] === null) {
                            full = false;
                            break;
                        }
                    }
                    if (full) fullCols.push(c);
                }

                const totalCleared = fullRows.length + fullCols.length;

                if (totalCleared > 0) {
                    // Animation & Clear Logic
                    const cellsToClear = new Set();

                    fullRows.forEach(r => {
                        for (let c = 0; c < this.gridSize; c++) cellsToClear.add(`${r},${c}`);
                    });

                    fullCols.forEach(c => {
                        for (let r = 0; r < this.gridSize; r++) cellsToClear.add(`${r},${c}`);
                    });

                    cellsToClear.forEach(key => {
                        const [r, c] = key.split(',').map(Number);
                        const cellEl = this.getCellEl(r, c);
                        cellEl.classList.add('cell-clearing');

                        // Particle Explosion
                        const rect = cellEl.getBoundingClientRect();
                        this.particles.spawn(
                            rect.left + rect.width / 2, 
                            rect.top + rect.height / 2, 
                            this.grid[r][c] || '#38bdf8',
                            6
                        );

                        this.grid[r][c] = null;
                    });

                    // Screen Shake
                    document.getElementById('boardContainer').classList.add('animate-shake');
                    setTimeout(() => {
                        document.getElementById('boardContainer').classList.remove('animate-shake');
                        this.renderBoard();
                    }, 350);
                }

                return totalCleared;
            }

            triggerComboFX(linesCleared) {
                this.audio.playClear(this.combo);

                let text = `COMBO x${this.combo}!`;
                let subText = "IMPRESSIONANTE!";

                if (this.combo === 1 && linesCleared > 1) {
                    subText = "SUPER BLAST!";
                } else if (this.combo >= 3) {
                    subText = "LEGGENDARIO!!!";
                }

                this.comboText.innerText = text;
                this.comboSubText.innerText = subText;

                this.comboBanner.classList.remove('opacity-0', 'scale-50');
                this.comboBanner.classList.add('opacity-100', 'scale-100');

                setTimeout(() => {
                    this.comboBanner.classList.remove('opacity-100', 'scale-100');
                    this.comboBanner.classList.add('opacity-0', 'scale-50');
                }, 1200);
            }

            saveHistory() {
                this.history = {
                    grid: JSON.parse(JSON.stringify(this.grid)),
                    score: this.score,
                    piecesHTML: Array.from(this.piecesSlots).map(s => s.innerHTML)
                };
                this.updateUndoButton();
            }

            undoMove() {
                if (!this.history || this.undoAvailable <= 0) return;

                this.grid = JSON.parse(JSON.stringify(this.history.grid));
                this.score = this.history.score;
                this.updateScore(this.score);

                this.piecesSlots.forEach((s, idx) => {
                    s.innerHTML = this.history.piecesHTML[idx];
                });

                this.undoAvailable--;
                this.history = null;
                this.renderBoard();
                this.updateUndoButton();
                this.audio.playClick();
            }

            updateUndoButton() {
                this.undoBadge.innerText = this.undoAvailable;
                this.undoBtn.disabled = !this.history || this.undoAvailable <= 0;
            }

            checkGameOver() {
                let validMoveExists = false;

                // Check remaining pieces in slots
                this.piecesSlots.forEach(slot => {
                    const pieceEl = slot.querySelector('.piece-element');
                    if (pieceEl) {
                        const pieceData = JSON.parse(pieceEl.dataset.json);

                        for (let r = 0; r < this.gridSize; r++) {
                            for (let c = 0; c < this.gridSize; c++) {
                                if (this.canPlacePiece(pieceData.shape, r, c)) {
                                    validMoveExists = true;
                                    break;
                                }
                            }
                            if (validMoveExists) break;
                        }
                    }
                });

                const remainingPiecesCount = Array.from(this.piecesSlots).filter(s => s.children.length > 0).length;

                if (!validMoveExists && remainingPiecesCount > 0) {
                    setTimeout(() => this.showGameOverModal(), 600);
                }
            }

            showGameOverModal() {
                this.audio.playGameOver();
                document.getElementById('finalScore').innerText = this.score;
                document.getElementById('finalHighScore').innerText = this.highScore;

                const modal = document.getElementById('gameOverModal');
                const btnRevive = document.getElementById('btnRevive');

                if (this.reviveAvailable) {
                    btnRevive.classList.remove('hidden');
                } else {
                    btnRevive.classList.add('hidden');
                }

                modal.classList.remove('opacity-0', 'pointer-events-none');
                document.getElementById('gameOverContent').classList.remove('scale-90');
                document.getElementById('gameOverContent').classList.add('scale-100');
            }

            hideGameOverModal() {
                const modal = document.getElementById('gameOverModal');
                modal.classList.add('opacity-0', 'pointer-events-none');
            }

            useRevive() {
                if (!this.reviveAvailable) return;

                // Clear 3x3 Area in center
                for (let r = 2; r <= 5; r++) {
                    for (let c = 2; c <= 5; c++) {
                        this.grid[r][c] = null;
                    }
                }

                this.reviveAvailable = false;
                this.renderBoard();
                this.hideGameOverModal();
                this.audio.playClear(2);
            }

            updateScore(newScore) {
                this.score = newScore;
                this.scoreEl.innerText = this.score;

                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    this.highScoreEl.innerText = this.highScore;
                    localStorage.setItem('bb_highscore', this.highScore.toString());
                }
            }

            showStats() {
                document.getElementById('statPlayed').innerText = this.stats.played;
                document.getElementById('statLines').innerText = this.stats.lines;
                document.getElementById('statMaxCombo').innerText = this.stats.maxCombo;
                document.getElementById('statBlocks').innerText = this.stats.blocks;

                const modal = document.getElementById('statsModal');
                modal.classList.remove('opacity-0', 'pointer-events-none');
            }

            saveStats() {
                localStorage.setItem('bb_stats', JSON.stringify(this.stats));
            }
        }

        window.onload = () => {
            window.game = new BlockBlastGame();
        };
    </script>
</body>
